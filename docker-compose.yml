services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-assistance:
    build:
      context: ./ai_assistance
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    ports:
      - "8001:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  vacation-mode:
    build:
      context: ./vacation_mode
    restart: unless-stopped
    environment:
      AI_ASSISTANCE_URL: http://ai-assistance:8000
    depends_on:
      ai-assistance:
        condition: service_healthy
    ports:
      - "8002:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTO_SEED: ${AUTO_SEED:-true}
      SEED_STARTER_PLANTS: ${SEED_STARTER_PLANTS:-false}
      SESSION_LIFETIME_DAYS: ${SESSION_LIFETIME_DAYS:-7}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      NOTIFICATION_DISPATCH_TOKEN: ${NOTIFICATION_DISPATCH_TOKEN:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      PUBSUB_NOTIFICATION_TOPIC: ${PUBSUB_NOTIFICATION_TOPIC:-}
      PUBSUB_PUSH_SERVICE_ACCOUNT: ${PUBSUB_PUSH_SERVICE_ACCOUNT:-}
      PUBSUB_PUSH_AUDIENCE: ${PUBSUB_PUSH_AUDIENCE:-}
      SCHEDULER_SERVICE_ACCOUNT: ${SCHEDULER_SERVICE_ACCOUNT:-}
      SCHEDULER_AUDIENCE: ${SCHEDULER_AUDIENCE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8000
        VACATION_API_URL: http://vacation-mode:8001
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      VACATION_API_URL: http://vacation-mode:8001
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    depends_on:
      backend:
        condition: service_healthy
      vacation-mode:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
