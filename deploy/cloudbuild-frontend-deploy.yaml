substitutions:
  _REGION: asia-south1
  _REPOSITORY: plant-guardian
  _BACKEND_URL: https://backend-845145311784.asia-south1.run.app
  _VACATION_API_URL: https://vacation-mode-845145311784.asia-south1.run.app
  _GOOGLE_CLIENT_ID: ""

steps:
  - id: quality
    name: node:22-alpine
    dir: frontend
    entrypoint: sh
    args:
      - -ceu
      - |
        npm ci
        npm test
        npm run lint
        npm run build

  - id: build
    name: gcr.io/cloud-builders/docker
    waitFor: [quality]
    args:
      - build
      - --build-arg=API_URL=${_BACKEND_URL}
      - --build-arg=VACATION_API_URL=${_VACATION_API_URL}
      - --build-arg=NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:$SHORT_SHA
      - ./frontend

  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: [build]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:$SHORT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - frontend
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:$SHORT_SHA
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
