substitutions:
  _REGION: asia-south1
  _REPOSITORY: plant-guardian
  _BACKEND_URL: https://backend-845145311784.asia-south1.run.app
  _VACATION_API_URL: https://vacation-mode-845145311784.asia-south1.run.app
  _GOOGLE_CLIENT_ID: ""

steps:
  - id: backend-tests
    name: python:3.13-slim
    dir: backend
    entrypoint: bash
    args:
      - -ceu
      - |
        pip install --disable-pip-version-check --no-cache-dir -r requirements-dev.txt
        DATABASE_URL=sqlite+pysqlite:///:memory: python -m pytest -q

  - id: frontend-quality
    name: node:22-alpine
    dir: frontend
    entrypoint: sh
    args:
      - -ceu
      - |
        npm ci
        npm test
        npm run lint
        npm run build

  - id: build-ai-assistance
    name: gcr.io/cloud-builders/docker
    waitFor: [backend-tests, frontend-quality]
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-assistance:$SHORT_SHA
      - ./ai_assistance

  - id: build-vacation-mode
    name: gcr.io/cloud-builders/docker
    waitFor: [backend-tests, frontend-quality]
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/vacation-mode:$SHORT_SHA
      - ./vacation_mode

  - id: build-backend
    name: gcr.io/cloud-builders/docker
    waitFor: [backend-tests, frontend-quality]
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:$SHORT_SHA
      - ./backend

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: [backend-tests, frontend-quality]
    args:
      - build
      - --build-arg=API_URL=${_BACKEND_URL}
      - --build-arg=VACATION_API_URL=${_VACATION_API_URL}
      - --build-arg=NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:$SHORT_SHA
      - ./frontend

  - id: push-ai-assistance
    name: gcr.io/cloud-builders/docker
    waitFor: [build-ai-assistance]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-assistance:$SHORT_SHA

  - id: push-vacation-mode
    name: gcr.io/cloud-builders/docker
    waitFor: [build-vacation-mode]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/vacation-mode:$SHORT_SHA

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    waitFor: [build-backend]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:$SHORT_SHA

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: [build-frontend]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:$SHORT_SHA

  - id: deploy-ai-assistance
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-ai-assistance]
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ai-assistance
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-assistance:$SHORT_SHA
      - --quiet

  - id: deploy-vacation-mode
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-vacation-mode]
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - vacation-mode
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/vacation-mode:$SHORT_SHA
      - --quiet

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-backend]
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - backend
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:$SHORT_SHA
      - --quiet

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-frontend, deploy-backend, deploy-vacation-mode]
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - frontend
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:$SHORT_SHA
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
